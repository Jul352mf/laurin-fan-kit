[project]
name = "fanops"
version = "0.1.0"
description = "Daily public-signal sampler for the laurin-fan-kit stats page"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
fanops-sample = "fanops.sample:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fanops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
