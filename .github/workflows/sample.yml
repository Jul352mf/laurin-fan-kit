name: sample
on:
  schedule:
    - cron: "0 6 * * *"   # 08:00 Vienna in summer, 07:00 in winter
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sample
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Collect public numbers
        run: uv run --directory tools/fanops fanops-sample --root "$GITHUB_WORKSPACE"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Commit new samples
        if: always()
        run: |
          git config user.name "fanops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/samples.jsonl
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "sample: $(date -u +%FT%TZ)" && git push
          fi
